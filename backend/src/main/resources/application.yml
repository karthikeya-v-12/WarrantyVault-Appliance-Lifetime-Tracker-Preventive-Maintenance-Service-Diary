server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: warranty-vault-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/warrantyvault}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
    open-in-view: false

  sql:
    init:
      mode: never

# Custom Application Properties
app:
  alerts:
    warranty-expiring-days: 30
    maintenance-due-days: 7
